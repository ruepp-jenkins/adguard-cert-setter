server:
  host: 0.0.0.0
  port: 3000
  # Set this for origin validation when running behind a reverse proxy:
  # publicUrl: https://certificates.example.net
  cookieSecure: false
  # When both files are configured, the application starts with HTTPS.
  # tls:
  #   certificateFile: /certs/fullchain.pem
  #   privateKeyFile: /certs/privkey.pem
  #   privateKeyPassphrase: optional

auth:
  username: admin
  passwordHash: '$argon2id$v=19$m=19456,t=2,p=1$INSERT_HASH_HERE'
  sessionTtlHours: 8

storage:
  dataDirectory: /data

adguard:
  timeoutMs: 10000
  concurrency: 5
