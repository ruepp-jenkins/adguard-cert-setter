server:
  host: 0.0.0.0
  port: 3000
  # Bei Betrieb hinter einem Reverse Proxy für die Origin-Prüfung setzen:
  # publicUrl: https://certificates.example.net
  cookieSecure: false
  # Werden beide Dateien angegeben, startet die App direkt mit HTTPS.
  # tls:
  #   certificateFile: /certs/fullchain.pem
  #   privateKeyFile: /certs/privkey.pem
  #   privateKeyPassphrase: optional

auth:
  username: admin
  passwordHash: '$argon2id$v=19$m=19456,t=2,p=1$HASH_HIER_EINTRAGEN'
  sessionTtlHours: 8

storage:
  dataDirectory: /data

adguard:
  timeoutMs: 10000
  concurrency: 5
